name: Release
# Tag a version (git tag v0.1.0 && git push --tags) to build and publish both installers.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p spelly-win -p spelly-ui
      - name: Build installer
        shell: pwsh
        run: |
          $v = (Select-String -Path crates/spelly-win/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          iscc "/DAppVersion=$v" packaging\windows\spelly.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/Spelly-Setup.exe }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/Spelly-macOS.dmg }

  publish:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --title "Spelly ${{ github.ref_name }}" --generate-notes
