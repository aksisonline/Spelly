[package]
name = "spelly-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Spelly's window: home, recent fixes, dictionaries, settings. Built on GPUI."

[[bin]]
name = "spelly-ui"
path = "src/main.rs"

[dependencies]
spelly-core = { path = "../spelly-core" }
# Zed's GPUI (the snapshot gpui-component is built against), exposed as `gpui`.
gpui = { package = "gpui-pre", version = "0.3.14" }
# Unstyled text input + theme tokens; every other component is our own.
gpui-base = "0.11"
gpui_platform = { package = "gpui-pre-platform", version = "0.3.14", features = ["font-kit"] }
