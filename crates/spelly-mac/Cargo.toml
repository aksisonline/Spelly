[package]
name = "spelly-mac"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Spelly for macOS: event tap + menu bar around spelly-core."

[[bin]]
name = "spelly-mac"
path = "src/main.rs"

[dependencies]
spelly-core = { path = "../spelly-core" }


[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
tray-icon = { version = "0.21", default-features = false }
tao = "0.34"
foreign-types = "0.5"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString"] }
