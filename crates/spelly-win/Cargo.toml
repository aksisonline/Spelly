[package]
name = "spelly-win"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Spelly for Windows: keyboard hook + tray around spelly-core."

[[bin]]
name = "spelly"
path = "src/main.rs"

[dependencies]
spelly-core = { path = "../spelly-core" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
